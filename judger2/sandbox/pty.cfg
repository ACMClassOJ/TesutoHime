# Loaded before the profile and per-run arguments by nsjail-wrapper.
# Never replace these with bind mounts of the host's terminal devices.
# Preserve nsjail's CLI default; normal runs override this with --disable_proc,
# while Valgrind explicitly needs its sandbox's procfs.
mount_proc: true
mount {
  dst: "/dev/pts"
  fstype: "devpts"
  options: "newinstance,ptmxmode=0666,mode=0600,max=32"
  is_bind: false
  is_dir: true
  rw: true
  nosuid: true
  noexec: true
  nodev: false
  mandatory: true
}
mount {
  src: "pts/ptmx"
  dst: "/dev/ptmx"
  is_symlink: true
  mandatory: true
}
